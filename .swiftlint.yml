# SwiftLint configuration for Info
# Install: brew install swiftlint
# Run:     make lint

included:
  - Info
  - Tests

excluded:
  - build
  - DerivedData
  - Info.xcodeproj

# Opt-in to rules that catch real bugs but are not yet on by default.
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - operator_usage_whitespace
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

# Rules tuned to match the existing codebase style.
trailing_comma:
  severity: warning

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

# Disable rules that conflict with the codebase conventions or are noisy.
disabled_rules:
  - todo                        # PLAN.md tracks open items; inline TODOs are intentional
  - trailing_whitespace         # handled by editor config
  - nesting                     # the codebase uses nested types (e.g. enums in tests)
  - explicit_acl                # internal is the default and most types don't need it
  - explicit_top_level_acl
  - discouraged_direct_init     # URLSession/Process inits are intentional
  - force_unwrapping            # only in build-time tools / unavailable init?(coder:)
  - force_try                   # none in shipped code; leave as manual review

# Paths for custom rules (none yet).
custom_rules: {}
